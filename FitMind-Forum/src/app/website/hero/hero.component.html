<!-- ==============================================
  Hero Section
  =============================================== -->
<section class="vine-hero-2">
  <!-- Aurora Mesh Gradient Background Layers (Isolated & Non-Interactive) -->
  <div class="aurora-glow-container">
    <div class="aurora-blob aurora-blob-bottom-left"></div>
    <div class="aurora-blob aurora-blob-top-right"></div>
  </div>

  <div class="container position-relative" style="z-index: 2;">
    <div class="row justify-content-center">
      <div class="col-lg-10 text-center">
        <div class="hero-content" data-aos="fade-down" data-aos-easing="linear">

          <!-- Top Subline -->
          <div class="hero-subline mb-2">
            <span class="subline-dash">—</span> HELLO FROM THE TEAM <span class="subline-dash">—</span>
          </div>

          <!-- Main Title -->
          <h1 class="hero-title">
            YOU <span class="highlight-underline">FOUND<svg class="curved-underline" viewBox="0 0 200 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M 5 13 Q 100 23 195 9" stroke="#a2d829" stroke-width="7" stroke-linecap="round" />
            </svg></span> US.
          </h1>

          <!-- Tagline -->
          <p class="hero-tagline">
            And we're really glad you did.
          </p>

          <!-- Description -->
          <p class="hero-description mt-3">
            Whatever your reason for being here, our team is here to help with 1-on-1 coaching and a pile of free resources. 💪
          </p>

          <!-- Dynamic CTA Button -->
          <div class="hero-actions mt-4">
            <a *ngIf="authService.isLoggedIn()" class="btn btn-hero-cta" routerLink="/add-post">
              <i class="bi bi-plus-lg me-2"></i> Share a Post
            </a>
            <button *ngIf="!authService.isLoggedIn()" class="btn btn-hero-cta" data-bs-toggle="modal" data-bs-target="#loginModal">
              Join the Community
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
