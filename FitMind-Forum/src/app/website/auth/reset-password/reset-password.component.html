<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%; border-radius: 10px;">
    
    <div class="text-center mb-4">
      <h3 class="font-weight-bold mb-2">Reset Password</h3>
      <p class="text-muted small">Enter your new password below</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="text-center py-4">
      <div class="spinner-border text-success" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-muted small">Validating your reset token...</p>
    </div>

    <!-- Invalid Token State -->
    <div *ngIf="!loading && !isValidToken" class="text-center py-4">
      <div class="alert alert-danger mb-4">
        The password reset link is invalid or has expired.
      </div>
      <a routerLink="/" class="btn btn-outline-secondary w-100 rounded-pill">Go to Homepage</a>
    </div>

    <!-- Reset Form -->
    <form *ngIf="!loading && isValidToken" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
      
      <div class="mb-3">
        <label class="form-label mx-1">New Password</label>
        <div class="position-relative">
          <input formControlName="newPassword" [type]="hideNewPassword ? 'password' : 'text'" class="form-control pe-5" placeholder="••••••••">
          <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent" (click)="hideNewPassword = !hideNewPassword" style="box-shadow: none;">
            <i class="bi text-muted" [ngClass]="hideNewPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <span class="text-danger small mx-1 mt-1 d-block"
          *ngIf="resetPasswordForm.controls['newPassword'].errors?.['required'] && resetPasswordForm.controls['newPassword'].touched">
          Password is required.
        </span>
        <span class="text-danger small mx-1 mt-1 d-block"
          *ngIf="resetPasswordForm.controls['newPassword'].errors?.['minlength'] && resetPasswordForm.controls['newPassword'].touched">
          Password must be at least 6 characters long.
        </span>
      </div>

      <div class="mb-4">
        <label class="form-label mx-1">Confirm Password</label>
        <div class="position-relative">
          <input formControlName="confirmPassword" [type]="hideConfirmPassword ? 'password' : 'text'" class="form-control pe-5" placeholder="••••••••">
          <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent" (click)="hideConfirmPassword = !hideConfirmPassword" style="box-shadow: none;">
            <i class="bi text-muted" [ngClass]="hideConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <span class="text-danger small mx-1 mt-1 d-block"
          *ngIf="resetPasswordForm.controls['confirmPassword'].errors?.['required'] && resetPasswordForm.controls['confirmPassword'].touched">
          Please confirm your password.
        </span>
        <span class="text-danger small mx-1 mt-1 d-block"
          *ngIf="resetPasswordForm.errors?.['mismatch'] && resetPasswordForm.controls['confirmPassword'].touched">
          Passwords do not match.
        </span>
      </div>

      <button type="submit" class="w-100 btn btn-mint py-2 font-weight-bold rounded-pill" [disabled]="resetPasswordForm.invalid || submitting">
        {{ submitting ? 'Resetting...' : 'Reset Password' }}
      </button>

    </form>

  </div>
</div>
