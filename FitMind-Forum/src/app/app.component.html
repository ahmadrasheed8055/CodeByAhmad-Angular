<div class="vine-wrapper">
  <!-- Top Slim Route Transition Loader -->
  <div class="global-route-loader" [class.active]="isNavigating">
    <div class="loader-bar"></div>
  </div>

  <router-outlet></router-outlet> 

  <!-- Scroll to Top Button -->
  <button class="scroll-to-top-btn" 
          [class.show]="showScrollTop" 
          (click)="scrollToTop()" 
          title="Go to top">
    <i class="bi bi-arrow-up-short"></i>
  </button>

  <!-- Chatbot Widget Floating Assistant -->
  <app-chatbot-widget></app-chatbot-widget>

  <!-- Root-level Global Auth Modals -->
  <app-login></app-login>
  <app-emailVarification></app-emailVarification>
  <app-forget-password></app-forget-password>
</div>
