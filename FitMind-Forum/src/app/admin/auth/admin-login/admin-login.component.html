<div class="admin-portal-wrapper">
  <!-- Top Left Back Link -->
  <header class="top-nav-bar">
    <a routerLink="/home" class="back-home-link">
      <i class="bi bi-arrow-left"></i>
      <span>BACK TO HOME</span>
    </a>
  </header>

  <!-- Centered Login Card -->
  <main class="portal-card-container">
    <div class="portal-card">
      <!-- Script Brand Logo -->
      <div class="brand-section">
        <h1 class="brand-logo">FitJoin</h1>
        <h2 class="portal-title">ADMIN SECURITY PORTAL</h2>
        <p class="portal-subtitle">Strictly for authorized administrators</p>
      </div>

      <!-- Error Notification -->
      <div *ngIf="errorMessage" class="error-alert">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Loading State -->
      <div *ngIf="isLoading" class="loading-state">
        <div class="spinner"></div>
        <span>Authenticating with Google...</span>
      </div>

      <!-- Action Buttons -->
      <div class="actions-section" [class.is-loading]="isLoading">
        <!-- Google OAuth Button -->
        <div class="google-btn-wrapper">
          <div #googleBtnContainer class="google-btn-native"></div>
          
          <!-- Fallback Direct Click Button if GSI iframe is loading -->
          <button type="button" class="custom-google-btn" (click)="triggerGoogleLogin()">
            <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>Sign in with Google</span>
          </button>
        </div>

        <!-- Go To Website Home Button -->
        <a routerLink="/home" class="btn-website-home">
          <i class="bi bi-house-door"></i>
          <span>GO TO WEBSITE HOME</span>
        </a>
      </div>

      <!-- Footer Security Badge -->
      <div class="card-footer-badge">
        <p>Protected by Google OAuth 2.0 & FitJoin Security</p>
      </div>
    </div>
  </main>
</div>
