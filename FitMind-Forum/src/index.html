  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="FM.png">

  <script>
     // Check local storage and system prefers-color-scheme on initial load
     let localS = localStorage.getItem('theme');
     let themeToSet = localS;
     
     // If local storage is not set, check OS preference	
     if (!localS) {
         themeToSet = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
     }

     // Set theme attributes on root html element
     document.documentElement.setAttribute('data-theme', themeToSet);
     document.documentElement.setAttribute('data-bs-theme', themeToSet);
  </script>
